---
# 1. Purane locks aur repo saaf karo
- name: Clean up apt locks and repository files
  ansible.builtin.shell: |
    rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock
    rm -f /etc/apt/sources.list.d/mysql.list /etc/apt/sources.list.d/mysql_ansible_repo.list
    dpkg --configure -a
  become: yes
  changed_when: false

# 2. IMPORTANT: Saare core aur common packages ko remove karo (8.4 ke traces hatane ke liye)
- name: Aggressively remove all MySQL 8.4 traces
  ansible.builtin.apt:
    name: 
      - "mysql-community-*"
      - "mysql-client*"
      - "mysql-server*"
      - "mysql-common"
      - "libmysqlclient*"
    state: absent
    purge: yes
  become: yes
  ignore_errors: yes


# 3. Broken dependencies ko clean karo
- name: Fix broken dependencies
  ansible.builtin.shell: apt-get autoremove -y && apt-get autoclean
  become: yes

# 4. Data directory delete karo (Downgrade ke liye mandatory hai)
- name: Remove old data directory
  ansible.builtin.file:
    path: /var/lib/mysql
    state: absent
  become: yes

# 5. Repo setup (Same as before)
- name: Configure MySQL APT repository
  ansible.builtin.apt_repository:
    repo: "deb http://repo.mysql.com/apt/ubuntu {{ ansible_distribution_release }} {{ 'mysql-8.4-lts' if '8.4' in mysql_version else 'mysql-8.0' }}"
    state: present
    update_cache: yes
    filename: mysql_ansible_repo
  become: yes

# 6. Final Installation: Core packages ko bhi include kiya hai
- name: Install MySQL components
  ansible.builtin.apt:
    name:
      - "mysql-community-server={{ mysql_version }}*"
      - "mysql-community-client={{ mysql_version }}*"
      - "mysql-community-server-core={{ mysql_version }}*"
      - "mysql-community-client-core={{ mysql_version }}*"
      - "mysql-client={{ mysql_version }}*"
      - "mysql-common={{ mysql_version }}*"
    state: present
    update_cache: yes
    allow_downgrade: yes
  become: yes
  notify: restart
