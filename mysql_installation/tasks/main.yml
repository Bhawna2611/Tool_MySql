---
- name: "User Selected Action: {{ mysql_action }}"
  ansible.builtin.debug:
    msg: "Performing {{ mysql_action }} operation"

- name: User check
  ansible.builtin.debug:
    msg: "Connecting as {{ ansible_user_id }} on {{ ansible_distribution }}"

# 1. CHECK Logic
- name: Include Check Logic
  include_tasks: check.yml
  when: mysql_action == "check" or mysql_action == "install"

# 2. INSTALL Logic (Replaced && with 'and')
- name: Debian Install
  include_tasks: install_debian.yml
  when: ansible_os_family == "Debian" and mysql_action == "install"

- name: RedHat Install
  include_tasks: install_redhat.yml
  when: ansible_os_family == "RedHat" and mysql_action == "install"

# 3. UNINSTALL Logic
- name: Include Uninstall Tasks
  when: mysql_action == "uninstall"
  block:
    - name: Debian Uninstall
      include_tasks: uninstall.yml
      when: ansible_os_family == "Debian"

    - name: RedHat Uninstall
      include_tasks: uninstall.yml
      when: ansible_os_family == "RedHat"
