---
- hosts: all
  gather_facts: no
  tasks:
    - name: Dynamically register hosts with correct user
      add_host:
        name: "{{ inventory_hostname }}"
        ansible_user: "{{ 'ubuntu' if 'Ubuntu' in platform_details else 'ec2-user' }}"
        ansible_host: "{{ public_ip_address }}"
        ansible_ssh_private_key_file: "/home/porwal-ji/bhawna/ansible/assign5/devops.pem"
        groups: "dynamic_hosts"

- hosts: dynamic_hosts
  become: yes
  gather_facts: yes
  roles:
    - mysql_installation
