---
# 1. Cleanup existing installation (Required to prevent version conflicts)
- name: Remove existing MySQL packages to allow version change
  ansible.builtin.dnf:
    name: 
      - mysql-community-server
      - mysql-community-client
    state: absent
  become: yes

# 2. MANDATORY: Remove data directory (Required because 8.0 cannot read 8.4 data)
- name: Remove old data directory for clean version switch
  ansible.builtin.file:
    path: /var/lib/mysql
    state: absent
  become: yes
  ignore_errors: yes

# 3. Clear Metadata and dnf cache
- name: Clear DNF cache
  ansible.builtin.shell: "dnf clean all && rm -rf /var/cache/dnf/*"
  become: yes

# 4. Create Dynamic Repository for the specific version
- name: Create MySQL repository file for version {{ mysql_version }}
  ansible.builtin.shell: |
    cat <<EOF > /etc/yum.repos.d/mysql-community.repo
    [mysql-community]
    name=MySQL {{ mysql_version }} Community Server
    baseurl=https://repo.mysql.com/yum/mysql-{{ mysql_version }}-community/el/9/x86_64/
    enabled=1
    gpgcheck=0
    EOF
  become: yes

# 5. Install MySQL Server and Notify Handler for restart
- name: Install MySQL Server packages
  ansible.builtin.shell: "dnf install -y mysql-community-server --disablerepo='*' --enablerepo='mysql-community' --nogpgcheck"
  become: yes
  notify: restart

# 6. Ensure Service is enabled and started
- name: Start MySQL service
  ansible.builtin.service:
    name: mysqld
    state: started
    enabled: yes
  become: yes
