---
plugin: amazon.aws.aws_ec2
regions:
  - eu-central-1

keyed_groups:
  - key: platform_details
    prefix: os
    separator: "_"

filters:
  instance-state-name:
    - running

compose:
  ansible_host: "{{ public_ip_address | default(private_ip_address) }}"
  ansible_user: "'ubuntu' if 'Linux' in platform_details else 'ec2-user'"
  ansible_ssh_private_key_file: /home/porwal-ji/bhawna/tool_mysql/assign5/Tool_MySql/devops.pem

