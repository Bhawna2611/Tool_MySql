---
plugin: amazon.aws.aws_ec2
regions:
  - eu-central-1

# Instances ko OS ke basis par group karne ke liye
keyed_groups:
  - key: platform_details
    prefix: os
    separator: "_"

# Sirf running instances uthane ke liye
filters:
  instance-state-name:
    - running

# Hostname setup
hostnames:
  - ip-address

compose:
  ansible_host: public_ip_address
  ansible_user: "'ubuntu' if 'Ubuntu' in platform_details else 'ec2-user'"
  ansible_ssh_private_key_file: "'/home/porwal-ji/bhawna/ansible/assign5/devops.pem'"
