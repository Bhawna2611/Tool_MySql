---
plugin: amazon.aws.aws_ec2
regions:
  - eu-central-1
filters:
  instance-state-name:
    - running
keyed_groups:
  - key: tags.Name
    prefix: tag
compose:
 ansible_user: "ansible_distribution == 'Ubuntu' | ternary('ubuntu', 'ec2-user')"
 ansible_ssh_extra_args: '-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
