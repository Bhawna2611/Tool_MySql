- name: Execute MySQL Role
  hosts: all
  become: yes
  vars:
    # If the tag "Name" contains 'ubuntu', use the 'ubuntu' user.
    # Otherwise, default to 'ec2-user'.
    ansible_user: "{{ 'ubuntu' if 'ubuntu' in (tags.Name | default('') | lower) else 'ec2-user' }}"
    ansible_ssh_private_key_file: "/home/porwal-ji/bhawna/tool_mysql/assign5/Tool_MySql/devops.pem"

  roles:
    - mysql_installation
